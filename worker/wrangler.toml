name = "hisaab-sync"
main = "index.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "GROUPS"
class_name = "GroupDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GroupDO"]

# 300 requests a minute per IP across all groups
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 300
  period = 60
